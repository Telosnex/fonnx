name: fonnx
description: >-
  ONNX model inference for Dart and Flutter on every platform: ONNX Runtime
  through FFI on native, Web Workers on the web. Embeddings, Whisper speech
  to text, Kokoro text to speech, and more.
version: 0.1.0
repository: https://github.com/Telosnex/fonnx
issue_tracker: https://github.com/Telosnex/fonnx/issues

environment:
  # kiln requires Dart 3.10 or newer.
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  args: ^2.7.0
  archive: ^4.0.9
  code_assets: ^1.0.0
  crypto: ^3.0.6
  ffi: ^2.1.3
  hooks: ">=1.0.1 <3.0.0"
  kiln: ^0.1.0
  ml_linalg: ^13.12.6
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
  ffigen: ^20.1.1
