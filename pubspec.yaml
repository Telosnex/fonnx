name: fonnx
description: Cross-platform ONNX inference for Flutter using Dart FFI and Web Workers.
version: 0.0.1
homepage: https://github.com/Telosnex/fonnx

environment:
  # Native-assets hooks require Dart 3.9 or newer.
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  args: ^2.7.0
  archive: ^4.0.9
  code_assets: ^1.0.0
  crypto: ^3.0.6
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  hooks: ">=1.0.1 <3.0.0"
  ml_linalg: ^13.12.6
  native_prebuilt:
    git:
      url: https://github.com/Telosnex/native_prebuilt.git
      ref: e995f4073e335ef57051ac930d05b6c5926fc44a
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^20.1.1
