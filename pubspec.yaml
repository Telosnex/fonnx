name: fonnx
description: Cross-platform ONNX inference for Dart and Flutter using Dart FFI and Web Workers.
version: 0.0.1
homepage: https://github.com/Telosnex/fonnx
publish_to: none

environment:
  # native_prebuilt requires Dart 3.10 or newer.
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  args: ^2.7.0
  archive: ^4.0.9
  code_assets: ^1.0.0
  crypto: ^3.0.6
  ffi: ^2.1.3
  hooks: ">=1.0.1 <3.0.0"
  ml_linalg: ^13.12.6
  native_prebuilt:
    git:
      url: https://github.com/Telosnex/native_prebuilt.git
      ref: dfe2a5bfeb95426e87f6243cab14f4affd879b38
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
  ffigen: ^20.1.1
