name: Native assets smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'hook/**'
      - 'lib/**'
      - 'native_artifacts/**'
      - 'src/**'
      - 'tool/**'
      - 'example/web/**'
      - 'example/assets/models/futoSwipe/**'
      - 'test/models/futo_swipe*.dart'
      - 'lib/models/futo_swipe/**'
      - 'lib/web/futo_swipe_*.js'
      - 'example/web/futo_swipe_*.js'
      - 'test/data/futo_swipe/**'
      - '.gitattributes'
      - 'test/ort_native_asset_test.dart'
      - 'test/models/bpe_decoder.onnx'
      - 'test/models/identity.onnx'
      - 'pubspec.yaml'
      - '.github/workflows/native-assets-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonnx-native-assets-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: macOS arm64
            runner: macos-15
          - name: Windows x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Hydrate Git LFS model fixtures
        run: dart tool/hydrate_lfs_models.dart
      - run: flutter pub get
      - run: flutter analyze
      - name: Verify source, native, Web, and model manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dart run tool/verify_artifacts.dart
      - name: Run pinned local ORT Web identity inference
        run: node tool/test_web_runtime.mjs
      - name: Sanitize package-owned finalizer boundary
        if: runner.os != 'Windows'
        run: tool/test_native_sanitizers.sh
      - name: Run deterministic operation corpus
        run: flutter test test/deterministic_operation_corpus_test.dart --reporter expanded
      - name: Resolve ORT + Extensions and create real sessions
        run: flutter test test/ort_native_asset_test.dart --reporter expanded
      - name: Run FUTO Swipe conversion and native inference regressions
        run: flutter test test/models/futo_swipe_core_test.dart test/models/futo_swipe_converter_test.dart test/models/futo_swipe_test.dart test/models/futo_swipe_api_test.dart --concurrency=1 --reporter expanded
