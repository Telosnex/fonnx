name: Native assets smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'hook/**'
      - 'lib/**'
      - 'native_artifacts/**'
      - 'src/**'
      - 'tool/**'
      - 'example/web/**'
      - 'example/assets/models/futoSwipe/**'
      - 'test/models/futo_swipe*.dart'
      - 'lib/models/futo_swipe/**'
      - 'lib/web/futo_swipe_*.js'
      - 'test/data/futo_swipe/**'
      - '.gitattributes'
      - 'test/ort_native_asset_test.dart'
      - 'test/models/identity.onnx'
      - 'pubspec.yaml'
      - '.github/workflows/native-assets-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonnx-native-assets-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: macOS arm64
            runner: macos-15
          - name: Windows x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # flutter-action caches with an unpinned actions/cache, which the
      # repository's action policy rejects. Same install as native_release.yml.
      - name: Install Flutter
        shell: bash
        run: |
          git clone -q --depth 1 --branch 3.47.0 \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics > /dev/null
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/assets/models/**/*.onnx
          key: hf-models-smoke-${{ runner.os }}-${{ hashFiles('native_artifacts/manifest.json') }}
          restore-keys: hf-models-smoke-${{ runner.os }}-
      # The tests use futoSwipe and magika. flutter analyze checks the assets
      # of example/pubspec.yaml, which lists the other models.
      - name: Fetch Hugging Face models
        run: dart run tool/fetch_hf_models.dart futoSwipe keywordSpotter magika miniLmL6V2 minishLab msmarcoMiniLmL6V3 pyannote sileroVad whisper
      - run: flutter analyze
      - name: Verify source, native, Web, and model manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dart run tool/verify_artifacts.dart
      - name: Install the pinned web files into lib/web
        run: dart run native_prebuilt:web install-dev
      - name: Run pinned local ORT Web identity inference
        run: node tool/test_web_runtime.mjs
      - name: Sanitize package-owned finalizer boundary
        if: runner.os != 'Windows'
        run: tool/test_native_sanitizers.sh
      - name: Run deterministic operation corpus
        run: flutter test test/deterministic_operation_corpus_test.dart --reporter expanded
      - name: Resolve ORT and create real sessions
        run: flutter test test/ort_native_asset_test.dart --reporter expanded
      - name: Run FUTO Swipe conversion and native inference regressions
        run: flutter test test/models/futo_swipe_core_test.dart test/models/futo_swipe_converter_test.dart test/models/futo_swipe_test.dart test/models/futo_swipe_api_test.dart --concurrency=1 --reporter expanded
