name: Kiln check

on:
  pull_request:
    branches: [main]
    paths:
      - native_artifacts/prebuilt.json
      - lib/src/kiln.g.dart
      - .github/workflows/kiln_check.yml
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-check:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_check.yml@578473461fc30c68c68fc6e07941dcfc2c070b54 # v0.5.10
