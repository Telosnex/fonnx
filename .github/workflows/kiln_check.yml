name: Kiln check

on:
  pull_request:
    branches: [main]
    paths:
      - native_artifacts/prebuilt.json
      - lib/src/kiln.g.dart
      - .github/workflows/kiln_check.yml
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-check:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_check.yml@fd2f9876ef2384fc7841cccd64049f7f5c387c18 # v0.5.13
