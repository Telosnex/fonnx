name: Kiln check

on:
  pull_request:
    branches: [main]
    paths:
      - native_artifacts/prebuilt.json
      - lib/src/kiln.g.dart
      - .github/workflows/kiln_check.yml
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-check:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_check.yml@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
