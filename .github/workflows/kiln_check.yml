name: Kiln check

on:
  pull_request:
    branches: [main]
    paths:
      - native_artifacts/prebuilt.json
      - lib/src/kiln.g.dart
      - .github/workflows/kiln_check.yml
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-check:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_check.yml@c03733211dca28d8590002199d7a87af85edde51 # v0.5.7
