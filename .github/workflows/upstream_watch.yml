# Daily: do the sources in .github/upstream.yaml have an update? The run
# fails when one does, and GitHub emails whoever last changed this file.
# See Upstream watch in the telosnex_ci_tools README.
name: Upstream watch

on:
  schedule:
    - cron: '23 7 * * *'
  push:
    branches: [main]
    # Also the files that set the pin, so an ORT update re-checks it.
    paths:
      - .github/ort_watch.dart
      - .github/upstream.yaml
      - .github/workflows/upstream_watch.yml
      - native_artifacts/upstream_ort.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/upstream_watch.yml@c1c96dee1b426f3617d5e9caf60fd45899bb8a4f # v0.5.20
