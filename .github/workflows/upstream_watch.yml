# Daily: do the sources in .github/upstream.yaml have an update? The run
# fails when one does, and GitHub emails whoever last changed this file.
# See Upstream watch in the telosnex_ci_tools README.
name: Upstream watch

on:
  schedule:
    - cron: '23 7 * * *'
  push:
    branches: [main]
    paths: [.github/upstream.yaml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/upstream_watch.yml@c03733211dca28d8590002199d7a87af85edde51 # v0.5.7
