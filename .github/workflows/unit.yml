name: Unit

on:
  pull_request:
    branches: [main]
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@ac661f93e2b65b203d12956ecc215da3b8ddf871 # main
      - run: flutter pub get
      # Not the generated lib/src/kiln.g.dart (its bytes are pinned).
      - run: git ls-files 'lib/*.dart' 'test/*.dart' 'tool/*.dart' | grep -v '\.g\.dart$' | xargs dart format --output=none --set-exit-if-changed
      # The package only: the example's assets are the models (Integration).
      - run: dart analyze --fatal-warnings lib test tool
      - run: dart run kiln:check
      - run: dart run kiln:web install-dev
      # The Node test runs the magika model (8 MB).
      - run: dart run tool/fetch_hf_models.dart magika
      - name: ORT Web identity inference (Node)
        run: node tool/test_web_runtime.mjs
      - run: dart test test/deterministic_operation_corpus_test.dart -r expanded
