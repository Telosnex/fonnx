# Upstream sources, checked daily by the Upstream watch workflow
# (telosnex_ci_tools, lib/src/upstream.dart). Set `seen` to skip an update.
sources:
  - name: ONNX Runtime
    tags: https://github.com/microsoft/onnxruntime.git
    pin: {file: native_artifacts/upstream_ort.json, pattern: '"version":\s*"([0-9.]+)"'}
