name: fonnx_example
description: Demonstrates how to use the fonnx plugin.
publish_to: "none"

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  fonnx:
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../

  cupertino_icons: ^1.0.2
  ffi: ^2.1.0
  path: ^1.8.3
  path_provider: ^2.1.1
  libmonet:
    git:
      url: https://github.com/Telosnex/libmonet.git
      # A commit, not the main branch: a branch can change under consumers.
      ref: c4c2cc09c5e710e5f6ead53fd6e905bd5d20b854
  file_picker: ^10.1.9
  collection: ^1.18.0
  ml_linalg: ^13.12.6
  # Microphone capture and playback (was record and audioplayers).
  # A commit with prebuilt files (release native-4f2669ef5e1899aa): at a
  # commit without them, the source build fails. Move it after a Kiln
  # release of telosnex_audio.
  telosnex_audio:
    git:
      url: https://github.com/Telosnex/telosnex_audio.git
      ref: 7f1a89adf77acc6b57ab1c85bde7e8312c41a983
  permission_handler: ^12.0.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/magika/magika.onnx
    - assets/models/miniLmL6V2/miniLmL6V2.onnx
    - assets/models/minishLab/potion8m.onnx
    - assets/models/minishLab/potion32m.onnx
    - assets/models/msmarcoMiniLmL6V3/msmarcoMiniLmL6V3.onnx
    - assets/models/sileroVad/silero_vad_v6.2.1.onnx
    - assets/models/keywordSpotter/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx
    - assets/models/keywordSpotter/decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx
    - assets/models/keywordSpotter/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx
    - assets/models/whisper/whisper_tiny_decoder.onnx
    - assets/models/whisper/whisper_tiny_encoder.onnx
    - assets/models/pyannote/pyannote_seg3.onnx
    - assets/text_sample.txt
    - assets/audio_sample.wav
    - assets/audio_sample.pcm
    - assets/audio_sample_16khz.wav
    - assets/audio_sample_ac1_ar16000.pcm
    - assets/telosnex_hotword_3times_ar16000.pcm
    - assets/silence_16khz.wav